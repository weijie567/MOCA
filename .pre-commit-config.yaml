minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: Ruff check with safe fixes
        entry: uv run --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run --extra dev ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: ruff-full-repository-gate
        name: Full repository Ruff gate
        entry: make lint
        language: system
        pass_filenames: false
        stages: [pre-push]
