name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev
      - run: make lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: moca
          POSTGRES_USER: moca
          POSTGRES_PASSWORD: moca_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moca -d moca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev
      - name: Install CJK font for deterministic PDF fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-wqy-zenhei
          cjk_font_path=$(find /usr/share/fonts -type f -name 'wqy-zenhei.ttc' -print -quit)
          test -n "$cjk_font_path"
          echo "MOCA_CJK_FONT=$cjk_font_path" >> "$GITHUB_ENV"
          sha256sum "$cjk_font_path"
      - run: uv run pytest tests/ -x --ignore=tests/integration -q --tb=short
