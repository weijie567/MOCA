[project]
name = "moca"
version = "0.1.0"
description = "Merchant Operations Collaborative Agent"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.0",
  "pyjwt>=2.8",
  "bcrypt>=4.0,<5",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
  "openai>=1.30",
  # Phase 64.4 pins the offline text-embedding-v4 counting runtime exactly.
  "tokenizers==0.23.1",
  "langgraph>=0.4",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-openai>=0.3",
  "langchain-core>=0.3",
  "psycopg[binary,pool]>=3.1",
  "sse-starlette>=1.6",
  # Phase 21 local parser/OCR pins are exact for ingestion reproducibility.
  "pdfplumber==0.11.10",
  "pypdfium2==5.10.1",
  "python-docx==1.2.0",
  "pytesseract==0.3.13",
  "Pillow==12.2.0",
  "reportlab==5.0.0",
  "filetype==1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "pre-commit>=4.0",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
